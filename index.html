<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>09.22 Date Questionnaire - Initial Concept</title>
<style>
:root{
  --blue:#6f9fbd;
  --blue-dark:#4e7f9d;
  --bg:#eef5f8;
  --text:#2f3a44;
  --muted:#6e7b86;
  --line:#dfe7ec;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.hidden{display:none!important}
.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:24px 14px;
}
.form{
  width:100%;
  max-width:560px;
}
.header-line{
  height:10px;
  background:var(--blue);
  border-radius:8px 8px 0 0;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:0 0 8px 8px;
  padding:28px 24px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.badge{
  display:inline-block;
  font-size:12px;
  letter-spacing:.08em;
  color:var(--blue-dark);
  margin-bottom:12px;
}
h1{
  font-size:27px;
  line-height:1.35;
  margin:0 0 18px;
  font-weight:700;
}
.description{
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
  margin-bottom:26px;
}
button{
  font:inherit;
  cursor:pointer;
}
.primary{
  width:100%;
  border:none;
  border-radius:6px;
  padding:14px 16px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  font-size:15px;
}
.progress{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}
.progressbar{
  height:5px;
  border-radius:999px;
  background:#e9eef1;
  overflow:hidden;
  margin-bottom:26px;
}
.progressbar span{
  display:block;
  height:100%;
  width:0;
  background:var(--blue);
}
.q-title{
  font-size:22px;
  line-height:1.55;
  margin:0 0 18px;
}
.q-sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  margin-bottom:24px;
}
.option{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--line);
  background:#fff;
  padding:14px;
  border-radius:6px;
  margin-bottom:10px;
  text-align:left;
  color:var(--text);
}
.radio{
  width:18px;height:18px;border:2px solid #a9b6bf;border-radius:50%;
  flex:0 0 auto;
}
.option:hover{background:#f7fafb}
.note{
  margin-top:18px;
  min-height:22px;
  color:var(--blue-dark);
  font-size:13px;
}
.result h2{font-size:24px;margin:0 0 14px}
.result p{color:var(--muted);line-height:1.85}
.small{
  margin-top:22px;
  font-size:12px;
  color:#98a3ab;
  text-align:center;
}
@media(max-width:420px){
  .page{padding:14px 10px}
  .card{padding:24px 18px}
  h1{font-size:24px}
  .q-title{font-size:20px}
}
</style>
</head>
<body>

<section id="start" class="page">
  <div class="form">
    <div class="header-line"></div>
    <div class="card">
      <div class="badge">PRIVATE INVITATION</div>
      <h1>デート前に<br>7つだけ確認があります</h1>
      <div class="description">
        難しく考えず、直感で答えてください。<br>
        ただし、回答画面には少しだけ不具合があります。笑
      </div>
      <button class="primary" id="startBtn">回答をはじめる</button>
    </div>
    <div class="small">09.22 DATE QUESTIONNAIRE</div>
  </div>
</section>

<section id="quiz" class="page hidden">
  <div class="form">
    <div class="header-line"></div>
    <div class="card">
      <div id="progressText" class="progress"></div>
      <div class="progressbar"><span id="bar"></span></div>
      <h2 id="question" class="q-title"></h2>
      <div id="sub" class="q-sub"></div>
      <button class="option" id="yes">
        <span class="radio"></span><span id="yesText"></span>
      </button>
      <button class="option" id="no">
        <span class="radio"></span><span id="noText"></span>
      </button>
      <div id="note" class="note"></div>
    </div>
  </div>
</section>

<section id="result" class="page hidden">
  <div class="form">
    <div class="header-line"></div>
    <div class="card result">
      <div class="badge">COMPLETE</div>
      <h2>回答ありがとうございました！</h2>
      <p>
        7つの質問は以上です。<br><br>
        9/22の予定は、当日のお楽しみということで。<br>
        とりあえず11時頃にお迎えに行きます。
      </p>
    </div>
    <div class="small">SEE YOU ON 09.22</div>
  </div>
</section>

<script>
const qs=[
  ["9/22、デートしてくれますか？","まずはここから。","もちろん！","ちょっと考える"],
  ["ちょっとは好きですか？","「ちょっとは」なので難易度低めです。笑","好きです☺️","まだ秘密"],
  ["デートでは、いっぱい甘えてくれますか？","無理のない範囲で。","がんばります","様子見で笑"],
  ["たくさんくっついてくれますか？","前回より少し近くなれたら嬉しいです。","少しなら…","慣れてから！"],
  ["今度、泊まりで温泉デートも行ってくれますか？♨️","寒くなった頃に。","寒くなったらね","まだ早いです笑"],
  ["デートのあと、ちょっと帰したくなくなっても怒らないですか？笑","答えは当日の気分で。","場合によります😗","帰ります笑"],
  ["結婚するまで一緒にいてくれますか？","最後だけ急に話を大きくしました。笑","それは気が早い笑","重い重い笑"]
];
let i=0;
const $=id=>document.getElementById(id);
function show(id){
  ["start","quiz","result"].forEach(x=>$(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}
function render(){
  const q=qs[i];
  $("progressText").textContent=`質問 ${i+1} / ${qs.length}`;
  $("bar").style.width=`${(i/qs.length)*100}%`;
  $("question").textContent=q[0];
  $("sub").textContent=q[1];
  $("yesText").textContent=q[2];
  $("noText").textContent=q[3];
  $("note").textContent="";
}
function next(answer){
  if(answer==="no"){
    $("note").textContent="その回答は受け付けていません。笑";
    return;
  }
  i++;
  if(i>=qs.length){
    $("bar").style.width="100%";
    setTimeout(()=>show("result"),350);
  }else{
    render();
  }
}
$("startBtn").onclick=()=>{i=0;render();show("quiz")};
$("yes").onclick=()=>next("yes");
$("no").onclick=()=>next("no");
</script>
</body>
</html>
